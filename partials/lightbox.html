<dialog class="lb" id="lb" aria-labelledby="lb-title">
  <div class="lb__bar">
    <span class="lb__count mono" data-lb-count></span>
    <div class="lb__tools">
      <button type="button" class="lb__btn lb__btn--color" data-lb-color aria-pressed="false">Ver a color</button>
      <button type="button" class="lb__btn" data-lb-prev aria-label="Anterior">←</button>
      <button type="button" class="lb__btn" data-lb-next aria-label="Siguiente">→</button>
      <button type="button" class="lb__btn lb__btn--close" data-lb-close aria-label="Cerrar">Cerrar ✕</button>
    </div>
  </div>

  <div class="lb__body">
    <div class="lb__stage" data-lb-stage></div>

    <aside class="lb__info">
      <p class="lb__kicker mono" data-lb-kicker></p>
      <h3 class="lb__title" id="lb-title" data-lb-title></h3>
      <ul class="lb__badges" data-lb-badges></ul>
      <p class="lb__desc" data-lb-desc></p>
      <dl class="lb__credits" data-lb-credits></dl>
      <div class="lb__thumbs" data-lb-thumbs></div>
      <a class="btn btn--solid lb__cta" href="#contacto" data-lb-contact data-track="lb-contacto">Quiero algo así <b aria-hidden="true">→</b></a>
    </aside>
  </div>
</dialog>
